<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDF1EC">
<title>排便與頭痛紀錄</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="排便頭痛紀錄">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EDF1EC; --card:#FFFFFF; --ink:#1D2829; --muted:#5B6867; --line:#D5DCD4;
  --stool:#9A6417; --stool-soft:#F4E7D2;
  --head:#4A53A3; --head-soft:#E3E5F6;
  --danger:#B23A3A;
  --accent:var(--stool); --accent-soft:var(--stool-soft);
  --font:"Noto Sans TC","PingFang TC","Heiti TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131819; --card:#1D2425; --ink:#E4EAE8; --muted:#97A4A2; --line:#2F393A;
    --stool:#DDA650; --stool-soft:#3A2F1E; --head:#A1A8F2; --head-soft:#2A2D48; --danger:#EE7B7B;
  }
}
:root[data-theme="dark"]{
  --bg:#131819; --card:#1D2425; --ink:#E4EAE8; --muted:#97A4A2; --line:#2F393A;
  --stool:#DDA650; --stool-soft:#3A2F1E; --head:#A1A8F2; --head-soft:#2A2D48; --danger:#EE7B7B;
}
body[data-type="head"]{ --accent:var(--head); --accent-soft:var(--head-soft); }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 140px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 0 10px}
.titlerow{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:12px}
h1{font-size:20px;font-weight:700;margin:0;letter-spacing:.02em}
.sync{font-size:12px;color:var(--muted)}
.types{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.types button{border:0;background:transparent;padding:10px 0;border-radius:10px;font-size:17px;font-weight:500;color:var(--muted)}
.types button[aria-selected="true"]{background:var(--accent);color:var(--card);font-weight:700}
.views{display:flex;gap:20px;margin-top:12px;padding:0 4px}
.views button{border:0;background:none;padding:4px 0;font-size:15px;color:var(--muted);border-bottom:2px solid transparent}
.views button[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}

.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}
.sec h2{font-size:15px;font-weight:700;margin:0 0 10px}
.hint{font-size:13px;color:var(--muted);font-weight:400;margin-left:6px}

/* 形狀:整個按鈕都可以點 */
.shapes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.shape{border:1.5px solid var(--line);background:var(--card);border-radius:14px;min-height:64px;padding:10px 12px;display:flex;align-items:center;gap:10px;text-align:left}
.shape svg{flex:none;width:40px;height:27px;color:var(--muted)}
.shape span{display:flex;flex-direction:column;line-height:1.3}
.shape b{font-size:17px;font-weight:500}
.shape small{font-size:12px;color:var(--muted)}
.shape[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.shape[aria-pressed="true"] svg{color:var(--accent)}
.shape[aria-pressed="true"] b{font-weight:700}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 18px;font-size:16px;min-height:44px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:700}
.chips.grid4{display:grid;grid-template-columns:repeat(4,1fr)}
.chips.grid4 .chip{padding:8px 0;border-radius:10px}
.chips.grid4 .chip[aria-pressed="true"]::before{content:"✓ "}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pair .chips{flex-wrap:nowrap}
.pair .chip{flex:1;padding:8px 0}

textarea{width:100%;min-height:76px;resize:vertical;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
textarea::placeholder{color:var(--muted)}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.recbtn{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:528px;margin:0 auto;border:0;border-radius:18px;background:var(--accent);color:var(--card);padding:14px 20px;box-shadow:0 6px 18px -8px var(--accent)}
.recbtn .l{font-size:19px;font-weight:700}
.recbtn .r{text-align:right;line-height:1.2}
.recbtn .r span{display:block;font-size:12px;opacity:.85}
.recbtn .r strong{font-size:24px;font-variant-numeric:tabular-nums}
.recbtn:active{transform:scale(.985)}

.today-head{display:flex;justify-content:space-between;align-items:baseline}
.count{font-size:13px;color:var(--muted)}
.empty{color:var(--muted);font-size:14px;margin:4px 0 0}
.items{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:52px 1fr auto;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.item:first-child{border-top:0}
.item time{font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent)}
.item .tags{font-size:14px}
.item .note{font-size:13px;color:var(--muted);margin-top:2px;white-space:pre-wrap;word-break:break-word}
.del{border:0;background:none;color:var(--muted);font-size:13px;padding:4px 6px}
.del.confirm{color:var(--danger);font-weight:700}
.daylabel{font-size:13px;font-weight:700;color:var(--muted);margin:14px 0 2px}

/* 統計 */
.periods{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.periods::-webkit-scrollbar{display:none}
.periods .chip{flex:none;font-size:14px;padding:6px 14px;min-height:38px}
.dates{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end;margin-top:12px}
.dates label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:4px}
.dates input{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;min-height:44px}
.dates .to{padding-bottom:10px;color:var(--muted)}
.range{font-size:13px;color:var(--muted);margin-top:8px}
.range.err{color:var(--danger)}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.num strong{display:block;font-size:28px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.num span{font-size:12px;color:var(--muted)}
.dist{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:14px}
.dist .track{height:10px;background:var(--bg);border-radius:5px;overflow:hidden}
.dist .fill{height:100%;background:var(--accent);border-radius:5px}
.dist .v{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;min-width:72px}
.chart{display:flex;align-items:flex-end;gap:2px;height:120px;padding-top:6px}
.chart .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.chart .b{width:100%;max-width:26px;background:var(--accent);border-radius:3px 3px 0 0}
.chart .b.zero{background:var(--line);height:2px!important;border-radius:1px}
.chart .n{font-size:10px;color:var(--muted);line-height:1.2}
.axis{display:flex;gap:2px;margin-top:4px}
.axis span{flex:1;font-size:10px;color:var(--muted);text-align:center;white-space:nowrap;min-width:0}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.yn div{background:var(--bg);border-radius:12px;padding:10px 12px}
.yn strong{font-size:22px;font-variant-numeric:tabular-nums}
.yn span{display:block;font-size:12px;color:var(--muted)}
.note-s{font-size:12px;color:var(--muted);margin:8px 0 0}

.backup p{font-size:13px;color:var(--muted);margin:0 0 10px}
.backup .row{display:flex;gap:8px}
.backup button{flex:1;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px;font-size:15px;min-height:44px}

.toast{position:fixed;left:50%;transform:translate(-50%,20px);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 12px 10px 16px;border-radius:12px;display:flex;gap:14px;align-items:center;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:7;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;background:none;color:var(--bg);font-weight:700;text-decoration:underline;padding:4px}
.toast button.hidden{display:none}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
.hidden{display:none!important}
</style>
</head>
<body data-type="stool">
<div class="wrap">
  <header class="top">
    <div class="titlerow"><h1>排便與頭痛紀錄</h1><span class="sync">資料存在這支手機</span></div>
    <div class="types" role="tablist">
      <button role="tab" data-type="stool" aria-selected="true">排便</button>
      <button role="tab" data-type="head" aria-selected="false">頭痛</button>
    </div>
    <div class="views" role="tablist">
      <button role="tab" data-view="rec" aria-selected="true">紀錄</button>
      <button role="tab" data-view="stats" aria-selected="false">統計</button>
    </div>
  </header>
  <main id="main"></main>
</div>
<div class="bar" id="bar">
  <button class="recbtn" id="recbtn"><span class="l" id="recLabel">紀錄這次排便</span><span class="r"><span id="recDate"></span><strong id="recTime"></strong></span></button>
</div>
<div class="toast" id="toast" role="status"><span id="toastMsg"></span><button id="undo">復原</button></div>
<input type="file" id="importFile" accept=".json,application/json" class="hidden">

<script>
/* ---------- 選項 ---------- */
const SHAPES = [
  {k:'1', n:'顆粒狀', d:'一顆顆硬球', svg:'<circle cx="9" cy="17" r="4"/><circle cx="19" cy="11" r="4.2"/><circle cx="20" cy="23" r="3.6"/><circle cx="30" cy="16" r="4.2"/><circle cx="40" cy="12" r="3.6"/><circle cx="40" cy="23" r="3.2"/>'},
  {k:'2', n:'凹凸長條', d:'條狀但凹凸不平', svg:'<circle cx="9" cy="17" r="6"/><circle cx="17" cy="14.5" r="6.5"/><circle cx="25" cy="17" r="6.3"/><circle cx="33" cy="14.5" r="6.5"/><circle cx="40" cy="17" r="5.5"/>'},
  {k:'3', n:'裂痕長條', d:'條狀表面有裂痕', svg:'<rect x="3" y="10" width="42" height="13" rx="6.5"/><path d="M13 10l2.5 5M23 23l-2-5M32 10l1.5 4.5M39 23l-1.5-3.5" stroke="var(--card)" stroke-width="1.8" fill="none" stroke-linecap="round"/>'},
  {k:'4', n:'光滑長條', d:'條狀表面光滑', svg:'<path d="M5 18c0-5 6-7 19-7s19 2 19 7-6 6-19 6S5 23 5 18z"/>'},
  {k:'5', n:'軟塊狀', d:'柔軟小塊', svg:'<ellipse cx="11" cy="18" rx="7.5" ry="5.5"/><ellipse cx="25" cy="13" rx="6.5" ry="4.8"/><ellipse cx="37" cy="19" rx="7" ry="5"/>'},
  {k:'6', n:'糊狀/水狀', d:'不成形或水樣', svg:'<path d="M5 22c3-6 8-3 11-7s8-3 10 0 7 0 11 2 7 4 5 6-8 2-14 2-12 1-18 0-6-1-5-3z"/><circle cx="20" cy="9" r="1.8"/><circle cx="33" cy="10" r="1.4"/>'}
];
const TEXTURES = ['軟','適中','硬'];
const LOCS = ['單側','兩側','後頸','頭頂','太陽穴','臉頰','齒顎','眼窩'];
const YN = ['是','否'];
const PRESETS = [
  {k:'w', n:'最近一週'}, {k:'m', n:'最近一個月'}, {k:'q', n:'最近三個月'}, {k:'h', n:'最近半年'}, {k:'y', n:'最近一年'}
];
const WD = '日一二三四五六';
const LS_KEY = 'bh-tracker-v1';

/* ---------- 狀態 ---------- */
const ui = { type:'stool', view:'rec', from:'', to:'', pendingDel:null };
const blank = t => t === 'stool' ? { shape:null, texture:null, note:'' } : { locs:[], vomit:null, eye:null, note:'' };
const sel = { stool: blank('stool'), head: blank('head') };
let store = {};   // "stool-2026-09" -> 該月紀錄陣列

/* ---------- 小工具 ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const hm = d => pad(d.getHours()) + ':' + pad(d.getMinutes());
const md = d => (d.getMonth()+1) + '/' + d.getDate();
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d,n) => new Date(d.getFullYear(), d.getMonth(), d.getDate()+n);
function addMonths(d,n){
  const y = d.getFullYear(), m = d.getMonth()+n;
  const last = new Date(y, m+1, 0).getDate();
  return new Date(y, m, Math.min(d.getDate(), last));
}
const docIdFor = (type,t) => { const d = new Date(t); return type + '-' + d.getFullYear() + '-' + pad(d.getMonth()+1); };
function entriesOf(type){
  const out = [];
  for (const [k,arr] of Object.entries(store)) if (k.startsWith(type+'-')) out.push(...arr);
  return out.sort((a,b) => b.t - a.t);
}
const shapeName = k => (SHAPES.find(s => s.k === k) || {}).n;
const locsOf = e => Array.isArray(e.locs) ? e.locs : (e.loc ? [e.loc] : []);

/* ---------- 儲存(這支手機的瀏覽器) ---------- */
function load(){ try{ const v = localStorage.getItem(LS_KEY); if (v) store = JSON.parse(v) || {}; }catch(e){} }
function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(store)); }
  catch(e){ showToast('無法儲存:瀏覽器儲存空間已滿或被停用', false); }
}

/* ---------- 動作 ---------- */
let lastAdded = null, toastTimer = null;
function record(){
  const now = Date.now(), s = sel[ui.type];
  const e = { id: now.toString(36) + Math.random().toString(36).slice(2,6), t: now, note: s.note.trim() };
  if (ui.type === 'stool'){ e.shape = s.shape; e.texture = s.texture; }
  else { e.locs = LOCS.filter(l => s.locs.includes(l)); e.vomit = s.vomit; e.eye = s.eye; }
  const docId = docIdFor(ui.type, now);
  (store[docId] = store[docId] || []).push(e);
  save();
  lastAdded = { docId, id: e.id };
  sel[ui.type] = blank(ui.type);
  render();
  showToast('已紀錄 ' + hm(new Date(now)), true);
}
function removeEntry(docId, id){
  if (!store[docId]) return;
  store[docId] = store[docId].filter(e => e.id !== id);
  if (!store[docId].length) delete store[docId];
  save();
}
function showToast(msg, undo){
  $('#toastMsg').textContent = msg;
  $('#undo').classList.toggle('hidden', !undo);
  $('#toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('#toast').classList.remove('show'), 5000);
}
$('#undo').addEventListener('click', () => {
  if (lastAdded){ removeEntry(lastAdded.docId, lastAdded.id); lastAdded = null; render(); }
  $('#toast').classList.remove('show');
});

/* 備份 / 還原 */
function exportData(){
  const blob = new Blob([JSON.stringify({ app:'bh-tracker', version:1, exported:new Date().toISOString(), store }, null, 1)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '排便頭痛紀錄備份-' + ymd(new Date()) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
$('#importFile').addEventListener('change', async ev => {
  const f = ev.target.files[0]; ev.target.value = '';
  if (!f) return;
  try{
    const data = JSON.parse(await f.text());
    const incoming = data && data.store;
    if (!incoming || typeof incoming !== 'object') throw 0;
    let added = 0;
    for (const [k, arr] of Object.entries(incoming)){
      if (!/^(stool|head)-\d{4}-\d{2}$/.test(k) || !Array.isArray(arr)) continue;
      const cur = store[k] = store[k] || [];
      const ids = new Set(cur.map(e => e.id));
      arr.forEach(e => { if (e && e.id && typeof e.t === 'number' && !ids.has(e.id)){ cur.push(e); added++; } });
      if (!cur.length) delete store[k];
    }
    save(); render();
    showToast(added ? `已還原 ${added} 筆紀錄` : '備份裡的紀錄都已經存在', false);
  }catch(e){ showToast('這個檔案不是本程式的備份檔', false); }
});

/* ---------- 畫面:紀錄 ---------- */
function tagsText(e, type){
  if (type === 'stool')
    return [e.shape ? shapeName(e.shape) : '形狀未選', e.texture || '軟硬未選'].join(',');
  const l = locsOf(e);
  return [l.length ? l.join('、') : '位置未選', '嘔吐:' + (e.vomit || '未選'), '眼睛酸澀:' + (e.eye || '未選')].join(',');
}
function itemHTML(e, type){
  const conf = ui.pendingDel === e.id;
  return `<li class="item"><time>${hm(new Date(e.t))}</time>
    <div><div class="tags">${esc(tagsText(e,type))}</div>${e.note ? `<div class="note">${esc(e.note)}</div>` : ''}</div>
    <button class="del ${conf ? 'confirm' : ''}" data-del="${e.id}" data-doc="${docIdFor(type, e.t)}">${conf ? '確定刪除' : '刪除'}</button></li>`;
}
function chips(field, opts, isOn, cls=''){
  return `<div class="chips ${cls}">` + opts.map(o =>
    `<button class="chip" data-f="${field}" data-v="${o}" aria-pressed="${isOn(o)}">${o}</button>`).join('') + '</div>';
}
function renderRec(){
  const t = ui.type, s = sel[t];
  let h = '';
  if (t === 'stool'){
    h += `<section class="sec"><h2>形狀<span class="hint">點一下選取,再點一次取消</span></h2><div class="shapes">` +
      SHAPES.map(x => `<button class="shape" data-f="shape" data-v="${x.k}" aria-pressed="${s.shape === x.k}">
        <svg viewBox="0 0 48 32" fill="currentColor" aria-hidden="true">${x.svg}</svg><span><b>${x.n}</b><small>${x.d}</small></span></button>`).join('') +
      `</div></section>`;
    h += `<section class="sec"><h2>軟硬</h2>${chips('texture', TEXTURES, o => s.texture === o)}</section>`;
  } else {
    h += `<section class="sec"><h2>頭痛位置<span class="hint">可以選多個</span></h2>${chips('locs', LOCS, o => s.locs.includes(o), 'grid4')}</section>`;
    h += `<div class="pair"><section class="sec"><h2>嘔吐</h2>${chips('vomit', YN, o => s.vomit === o)}</section><section class="sec"><h2>眼睛酸澀</h2>${chips('eye', YN, o => s.eye === o)}</section></div>`;
  }
  h += `<section class="sec"><h2>備註</h2><textarea id="note" placeholder="${t === 'stool' ? '例如:顏色、有無出血、吃了什麼' : '例如:疼痛程度、吃了什麼藥、可能的誘因'}">${esc(s.note)}</textarea></section>`;

  const todayKey = ymd(new Date());
  const today = entriesOf(t).filter(e => ymd(new Date(e.t)) === todayKey);
  h += `<section class="sec"><div class="today-head"><h2>今天</h2><span class="count">${today.length} 次</span></div>` +
    (today.length ? `<ul class="items">${today.map(e => itemHTML(e,t)).join('')}</ul>` :
      `<p class="empty">今天還沒有紀錄。選好上面的項目後,按下方按鈕就會記下現在的時間。</p>`) + `</section>`;
  return h;
}

/* ---------- 畫面:統計 ---------- */
function presetRange(k){
  const today = startOfDay(new Date());
  const start = k === 'w' ? addDays(today, -6) : addDays(addMonths(today, -({m:1,q:3,h:6,y:12}[k])), 1);
  return { from: ymd(start), to: ymd(today) };
}
function buckets(start, endEx, days){
  const out = [];
  if (days <= 31){
    for (let d = new Date(start); d < endEx; d = addDays(d,1))
      out.push({ s:+d, e:+addDays(d,1), label: days <= 7 ? WD[d.getDay()] : String(d.getDate()) });
    return { unit:'每天', list: out };
  }
  if (days <= 120){
    for (let d = new Date(start); d < endEx; d = addDays(d,7))
      out.push({ s:+d, e:Math.min(+addDays(d,7), +endEx), label: md(d) });
    return { unit:'每週', list: out };
  }
  let d = new Date(start.getFullYear(), start.getMonth(), 1);
  const multiYear = start.getFullYear() !== addDays(endEx,-1).getFullYear();
  while (d < endEx){
    const n = new Date(d.getFullYear(), d.getMonth()+1, 1);
    const lbl = (multiYear && d.getMonth() === 0) ? String(d.getFullYear()).slice(2) + '/1' : (d.getMonth()+1) + '月';
    out.push({ s:Math.max(+d, +start), e:Math.min(+n, +endEx), label: lbl });
    d = n;
  }
  return { unit:'每月', list: out };
}
function distHTML(items, total){
  return `<div class="dist">` + items.map(([label,n]) => {
    const pct = total ? Math.round(n/total*100) : 0;
    return `<span>${esc(label)}</span><div class="track"><div class="fill" style="width:${pct}%"></div></div><span class="v">${n} 次 · ${pct}%</span>`;
  }).join('') + `</div>`;
}
function countBy(list, key, opts){
  const m = new Map(opts.map(o => [o,0])); let none = 0;
  list.forEach(e => { if (e[key] != null && m.has(e[key])) m.set(e[key], m.get(e[key])+1); else none++; });
  const arr = [...m.entries()];
  if (none) arr.push(['未選', none]);
  return arr;
}

function renderStats(){
  const t = ui.type;
  if (!ui.from || !ui.to) Object.assign(ui, presetRange('w'));
  const activePreset = (PRESETS.find(p => { const r = presetRange(p.k); return r.from === ui.from && r.to === ui.to; }) || {}).k;

  let h = `<section class="sec"><h2>查詢區間</h2><div class="periods">` +
    PRESETS.map(x => `<button class="chip" data-preset="${x.k}" aria-pressed="${activePreset === x.k}">${x.n}</button>`).join('') +
    `</div><div class="dates">
      <label>開始日期<input type="date" id="dFrom" value="${ui.from}" max="${ymd(new Date())}"></label>
      <span class="to">至</span>
      <label>結束日期<input type="date" id="dTo" value="${ui.to}" max="${ymd(new Date())}"></label></div>`;

  const start = parseYmd(ui.from), endEx = addDays(parseYmd(ui.to), 1);
  if (start >= endEx){
    return h + `<div class="range err">開始日期不能晚於結束日期,請重新選擇。</div></section>`;
  }
  const days = Math.round((endEx - start) / 864e5);
  h += `<div class="range">共 ${days} 天</div></section>`;

  const list = entriesOf(t).filter(e => e.t >= +start && e.t < +endEx);
  const daySet = new Set(list.map(e => ymd(new Date(e.t))));
  h += `<section class="sec"><div class="nums">
    <div class="num"><strong>${list.length}</strong><span>總次數</span></div>
    <div class="num"><strong>${daySet.size}</strong><span>${t === 'stool' ? '有排便的天數' : '頭痛的天數'}</span></div>
    <div class="num"><strong>${(list.length / days).toFixed(1)}</strong><span>平均每天次數</span></div></div></section>`;

  if (!list.length){
    h += `<section class="sec"><p class="empty">這段期間沒有紀錄。換一個查詢區間,或回到「紀錄」按下按鈕開始累積。</p></section>`;
    return h + backupHTML();
  }

  const { unit, list: bs } = buckets(start, endEx, days);
  bs.forEach(b => b.n = list.filter(e => e.t >= b.s && e.t < b.e).length);
  const max = Math.max(1, ...bs.map(b => b.n));
  const every = bs.length > 20 ? 5 : bs.length > 10 ? 2 : 1;
  h += `<section class="sec"><h2>${unit}次數</h2><div class="chart">` +
    bs.map(b => `<div class="col">${b.n && bs.length <= 16 ? `<span class="n">${b.n}</span>` : ''}<div class="b ${b.n ? '' : 'zero'}" style="height:${b.n/max*100}%"></div></div>`).join('') +
    `</div><div class="axis">` + bs.map((b,i) => `<span>${i % every === 0 ? b.label : ''}</span>`).join('') + `</div></section>`;

  if (t === 'stool'){
    h += `<section class="sec"><h2>形狀</h2>${distHTML(countBy(list,'shape',SHAPES.map(s=>s.k)).map(([k,n]) => [shapeName(k) || k, n]), list.length)}</section>`;
    h += `<section class="sec"><h2>軟硬</h2>${distHTML(countBy(list,'texture',TEXTURES), list.length)}</section>`;
  } else {
    const lc = LOCS.map(l => [l, list.filter(e => locsOf(e).includes(l)).length]).filter(([,n]) => n);
    const none = list.filter(e => !locsOf(e).length).length;
    if (none) lc.push(['未選', none]);
    h += `<section class="sec"><h2>頭痛位置</h2>${distHTML(lc, list.length)}<p class="note-s">位置可複選,百分比是「出現該位置的次數 ÷ 總次數」,加總可能超過 100%。</p></section>`;
    const v = list.filter(e => e.vomit === '是').length, ey = list.filter(e => e.eye === '是').length;
    h += `<section class="sec yn">
      <div><strong>${v}</strong> / ${list.length}<span>有嘔吐</span></div>
      <div><strong>${ey}</strong> / ${list.length}<span>有眼睛酸澀</span></div></section>`;
    const slots = [['清晨 0–6 點',0],['上午 6–12 點',0],['下午 12–18 點',0],['晚上 18–24 點',0]];
    list.forEach(e => slots[Math.floor(new Date(e.t).getHours()/6)][1]++);
    h += `<section class="sec"><h2>發生時段</h2>${distHTML(slots, list.length)}</section>`;
  }

  let lastDay = '', body = '';
  list.forEach(e => {
    const d = new Date(e.t), k = ymd(d);
    if (k !== lastDay){
      if (lastDay) body += '</ul>';
      body += `<div class="daylabel">${d.getFullYear()}/${md(d)}(${WD[d.getDay()]})</div><ul class="items">`;
      lastDay = k;
    }
    body += itemHTML(e,t);
  });
  h += `<section class="sec"><h2>明細</h2>${body}</ul></section>`;
  return h + backupHTML();
}
function backupHTML(){
  return `<section class="sec backup"><h2>備份</h2>
    <p>紀錄只存在這支手機的瀏覽器裡。清除瀏覽器資料或換手機前,請先下載備份檔,之後可以用「還原備份」匯入。</p>
    <div class="row"><button data-act="export">下載備份</button><button data-act="import">還原備份</button></div></section>`;
}

/* ---------- 繪製 ---------- */
function render(){
  document.body.dataset.type = ui.type;
  document.querySelectorAll('.types button').forEach(b => b.setAttribute('aria-selected', b.dataset.type === ui.type));
  document.querySelectorAll('.views button').forEach(b => b.setAttribute('aria-selected', b.dataset.view === ui.view));
  $('#main').innerHTML = ui.view === 'rec' ? renderRec() : renderStats();
  $('#bar').classList.toggle('hidden', ui.view !== 'rec');
  $('#recLabel').textContent = ui.type === 'stool' ? '紀錄這次排便' : '紀錄這次頭痛';
  const note = $('#note');
  if (note) note.addEventListener('input', () => { sel[ui.type].note = note.value; });
  const f = $('#dFrom'), to = $('#dTo');
  if (f) f.addEventListener('change', () => { if (f.value){ ui.from = f.value; render(); } });
  if (to) to.addEventListener('change', () => { if (to.value){ ui.to = to.value; render(); } });
}
function tick(){
  const d = new Date();
  $('#recDate').textContent = md(d) + '(' + WD[d.getDay()] + ')';
  $('#recTime').textContent = hm(d);
}

/* ---------- 事件 ---------- */
document.addEventListener('click', ev => {
  const b = ev.target.closest('button');
  if (!b) return;
  if (b.closest('.types')){ ui.type = b.dataset.type; ui.pendingDel = null; render(); window.scrollTo(0,0); return; }
  if (b.closest('.views')){ ui.view = b.dataset.view; ui.pendingDel = null; render(); window.scrollTo(0,0); return; }
  if (b.dataset.preset){ Object.assign(ui, presetRange(b.dataset.preset)); ui.pendingDel = null; render(); return; }
  if (b.dataset.act === 'export'){ exportData(); return; }
  if (b.dataset.act === 'import'){ $('#importFile').click(); return; }
  if (b.dataset.f){
    const s = sel[ui.type], f = b.dataset.f, v = b.dataset.v;
    if (f === 'locs') s.locs = s.locs.includes(v) ? s.locs.filter(x => x !== v) : [...s.locs, v];
    else s[f] = s[f] === v ? null : v;
    b.closest('section').querySelectorAll(`[data-f="${f}"]`).forEach(x =>
      x.setAttribute('aria-pressed', f === 'locs' ? s.locs.includes(x.dataset.v) : s[f] === x.dataset.v));
    return;
  }
  if (b.dataset.del){
    const id = b.dataset.del;
    if (ui.pendingDel === id){ removeEntry(b.dataset.doc, id); ui.pendingDel = null; }
    else { ui.pendingDel = id; setTimeout(() => { if (ui.pendingDel === id){ ui.pendingDel = null; render(); } }, 4000); }
    render();
  }
});
$('#recbtn').addEventListener('click', record);

load();
render(); tick(); setInterval(tick, 10000);
</script>
</body>
